name: Deploy SeleniumBase Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "cloudflare/selenium-worker/**"
      - "integrations/cloudflare/**"

jobs:
  deploy:
    name: Build image & deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/selenium-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Deploy (builds Docker image + pushes + deploys Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
